services:
  # Nexus Dashboard - Homepage based Dashboard for Nexus
  nexus-dashboard:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: nexus-dashboard
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    profiles: ["apps", "all"]
    networks:
      - default
    ports:
      - "${NEXUS_DASHBOARD_PORT:-3010}:3000"
    volumes:
      - $DOCKERDIR/appdata/nexus-dashboard/config:/app/config
      - $DOCKERDIR/appdata/nexus-dashboard/images:/app/public/images
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      TZ: $TZ
      PUID: $PUID
      PGID: $PGID
      HOMEPAGE_ALLOWED_HOSTS: "localhost:${NEXUS_DASHBOARD_PORT:-3010},127.0.0.1:${NEXUS_DASHBOARD_PORT:-3010},0.0.0.0:${NEXUS_DASHBOARD_PORT:-3010},${SERVER_IP:-localhost}:${NEXUS_DASHBOARD_PORT:-3010}"
    # DOCKER-LABELS-PLACEHOLDER

networks:
  default:
    driver: bridge